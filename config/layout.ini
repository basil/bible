; Overlay on resources/bsb.zip from the locked PTXprint release.
[config]
name = Bible
[document]
multibook = True
; Use the font's default interword stretch and shrink instead of BSB's limits.
ifspacing = False
; Interletter glue prevents XeTeX's native word hyphenation.
ifletter = False
letterspace = False
fontregular = Utopia||false|false|
fontbold = Utopia|Bold|false|false|
fontitalic = Utopia|Italic|false|false|
fontbolditalic = Utopia|Bold Italic|false|false|
toc = True
toctitle = Contents
usetoc3 = False
subject = Brenton Septuagint and Cambridge Paragraph KJV New Testament
settingsinpdf = False
[project]
id = BIBLE
bookscope = multiple
iffrontmatter = True
ifcolophon = False
colophontext =
copyright = Brenton and Cambridge Paragraph KJV: sources described in the editor's introduction.
license =
autotaghebgrk = False
canonicalise = False
ifusemodssty = True
ifusemodstex = True
[paragraph]
ifhyphenate = True
; PTXprint stores the same checkbox under both keys, despite this key's name.
ifnothyphenate = True
[finishing]
inclsettings = False
[header]
hdrright = Last Reference
[notes]
; BSB has no \x notes, so its template leaves both caller sequences at the shared
; a-z fallback. Brenton's cross-references need their own callers: PTXprint's
; suggested symbols with ¶ for the ∥ that Erewhon lacks, doubled for headroom
; over the busiest page (six cross-references).
xrcallers = †,‡,§,¶,#,††,‡‡,§§
