; Overlay on resources/bsb.zip from the locked PTXprint release. Each key must
; change what BSB sets; tests/test_config.py checks that it differs.
[document]
; Use the font's default interword stretch and shrink instead of BSB's limits.
ifspacing = False
; Interletter glue prevents XeTeX's native word hyphenation.
ifletter = False
letterspace = False
; The edition's text face, in place of BSB's Charis.
fontregular = Utopia||false|false|
fontbold = Utopia|Bold|false|false|
fontitalic = Utopia|Italic|false|false|
fontbolditalic = Utopia|Bold Italic|false|false|
; Generate the contents that content/front.sfm prints with \ztoc.
toc = True
; List each book by title and page alone, without BSB's abbreviation column.
usetoc3 = False
; No subject: PTXprint loads document/subject into its book list, and writes
; the book list as the PDF's Subject whatever this key says.
; Embedding the settings makes PTXprint write a second, prepress PDF; the
; repository and the provenance file already record them.
settingsinpdf = False
[project]
; Print every book in the book list the pipeline writes, not just the first.
bookscope = multiple
; Print content/front.sfm: the title page and contents.
iffrontmatter = True
; BSB's colophon is the Berean Standard Bible's publication notice.
ifcolophon = False
; PTXprint's canonical rewrite changes the printable text of the editor's
; introduction; typeset the prepared USFM as it is.
canonicalise = False
; Load config/ptxprint-mods.sty and config/ptxprint-mods.tex.
ifusemodssty = True
ifusemodstex = True
[paragraph]
; Hyphenate the text, which BSB leaves unhyphenated.
ifhyphenate = True
; PTXprint stores the same checkbox under both keys, despite this key's name.
ifnothyphenate = True
[finishing]
; The same checkbox as document/settingsinpdf.
inclsettings = False
[header]
; With BSB's mirrored header and empty left slot, the outer edge shows the
; first reference on even pages and the last on odd pages, instead of BSB's
; range on every page.
hdrright = Last Reference
