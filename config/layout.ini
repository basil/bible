; Overlay on resources/bsb.zip from the locked PTXprint release. Each key must
; change what BSB sets; tests/test_config.py checks that it differs.
[document]
; eBible opens Brenton's appendix with a chapter 1 that numbers nothing. Keep
; it: PTXprint would otherwise drop a chapter outside scripture, and the
; appendix's paragraphs, which it sets flush left, would be indented.
showxtrachapnums = True
; OLEBFont's word space is the typeface's own (Utopia's widened by a fifth
; when it is assembled). Disable BSB's global stretch/shrink limits, which
; were chosen for Charis.
ifspacing = False
; Interletter glue prevents XeTeX's native word hyphenation.
ifletter = False
letterspace = False
; Use OLEBFont, the family the image assembled for the edition, throughout,
; with its bold and italic faces so emphasis does not fall back to BSB's Charis.
; Native features give ordinary numbers proportional oldstyle figures in
; the text, headings, notes, front matter and contents; the chapter styles
; in ptxprint-mods.sty select lining figures instead.
fontregular = OLEBFont||false|false|onum=1|pnum=1
fontbold = OLEBFont|Bold|false|false|onum=1|pnum=1
fontitalic = OLEBFont|Italic|false|false|onum=1|pnum=1
fontbolditalic = OLEBFont|Bold Italic|false|false|onum=1|pnum=1
; Readers need a contents list for this edition's expanded book order;
; PTXprint's basic front matter template prints the generated list.
toc = True
; Match the mixed-case headings used on the edition's other front pages.
toctitle = Contents
; Embedding the settings makes PTXprint write a second, prepress PDF; the
; repository already records them.
settingsinpdf = False
; Hang the verse numbers of poetry before their lines, as PTXprint's aArp
; and WSG samples do, so that each line's first word stands at its indent
; whatever the number's width.
hangpoetry = True
; Leave the first paragraph after a heading flush left.
firstparaindent = False
; Join the last two words of a paragraph's final line with a non-breaking
; space, so that no line ends a paragraph with one short word.
preventorphans = True
; Include Unicode text and PDF/A-4 metadata for long-term archiving.
printarchive = True
[paper]
; Use ISO B5 with one continuous reading column. PTXprint stores the page
; size under all three keys; keep them in agreement.
height = 176mm, 250mm (B5)
width = 176mm, 250mm (B5)
pagesize = 176mm, 250mm (B5)
columns = False
; A dividing rule has no purpose with only one column.
ifverticalrule = False
; Previous alternative: 45 mm inside, 15 mm outside, 16 mm top, 24 mm
; bottom; 116 x 210 mm body area and 15 mm clear at the binding.
; To restore: margins = 15, gutter = 30, topmargin = 16, bottommargin = 24.
; Keep mods.tex's 24 mm note column and 6 mm gap for either alternative.
; Include the notes in the occupied area: 42 mm inside, 18 mm outside.
; The gutter adds to the base side margin.
; mods.tex uses that inner margin for a 6 mm gap, 24 mm of verse-aligned
; notes, and 12 mm clear at the binding, without narrowing the body column.
margins = 18
ifaddgutter = True
gutter = 24
; The 14/26.4 mm head/foot holds 54 lines of 11 pt leading by PTXprint's
; count (page height, less both margins and the 9 pt descender it adds to
; the foot, divided by the leading), with the foot near twice the head as
; Tschichold's canon has it. The body area is 116 x 209.6 mm; with notes,
; the occupied envelope is 146 x 209.6 mm, close to the B5 page proportion.
topmargin = 14
bottommargin = 26.4
; Use the 9 pt body selected in the layout editor.
; Header/footer gaps remain BSB's defaults; those are measured in points.
fontfactor = 9
[project]
; Identify this edition's editor and license on the publication-data page,
; replacing BSB's publication identity rather than inheriting its notice.
copyright = Copyright © 2026 Basil Crow
license = Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0). https://creativecommons.org/licenses/by-nc-nd/4.0/
; Print every book in the book list the pipeline writes, not just the first.
bookscope = multiple
; Print PTXprint's basic template: title, publication data, and contents.
iffrontmatter = True
; Suppress BSB's colophon because its publication notice describes another edition.
ifcolophon = False
; PTXprint's canonical rewrite changes the printable text of the editor's
; introduction; typeset the prepared USFM as it is.
canonicalise = False
; Enable the marker overrides needed for the edition's verse figures, Greek,
; supplied words, and note styling.
ifusemodssty = True
; Enable the TeX changes needed for hyphenation patterns, inner-margin
; notes, outer footer folios, optical margin alignment, and invisible chapters.
ifusemodstex = True
[vars]
; Give the generated title page this edition's title instead of BSB's title.
maintitle = The Holy Bible
; Identify the edition, its two source translations, and its editor on the
; title page. PTXprint inserts variables as TeX: \break separates the edition
; name from the source description; USFM's // would print as two slashes.
subtitle = Orthodox Liturgical English Bible\break{}Brenton’s Septuagint (Old Testament) and the King James Version conformed to the Byzantine Text (New Testament), edited by Basil Crow
; Label the generated publication data with the actual language of the text.
languagename = English
[paragraph]
; Set the 9 pt body on 11 pt leading, a ratio of 1.22 as in BSB's 9.5 on
; 11.642; the head and foot margins above are sized to hold whole lines of it.
linespacing = 11
; Allow hyphenation to avoid loose word spacing in justified scripture;
; BSB leaves it disabled.
ifhyphenate = True
; PTXprint stores the same checkbox under both keys, despite this key's name.
ifnothyphenate = True
[finishing]
; Disable the same settings-embedding checkbox as document/settingsinpdf;
; both keys must agree so BSB's value cannot re-enable the extra PDF.
inclsettings = False
[snippets]
; Produce grayscale output for printing.
pdfoutput = Gray
[header]
; Clear BSB's centered header folio through the native setting; mods.tex
; places visible folios at the outer footer while preserving suppression.
hdrcenter = -empty-
; With BSB's mirrored header and empty left slot, the outer edge shows the
; first reference on even pages and the last on odd pages, instead of BSB's
; range on every page. The shorter running heads reduce clutter and keep
; the chapter locator at the outer edge, above the relocated folio.
hdrright = Last Reference
[notes]
; Number front matter's footnotes and scripture references, where BSB
; letters them; the margin notes on scripture have no callers.
fncallers = 1,2,3,4,5,6,7,8,9
xrcallers = 1,2,3,4,5,6,7,8,9
; Set each footnote and cross reference apart, where BSB runs them into one
; paragraph: the margin notes are placed one by one, and the front matter's
; footnotes are already broken into full-width lines, which PTXprint must
; not unwrap and rebreak, keeping their discretionary hyphens mid-line.
fneachnewline = True
xreachnewline = True
; Omit the rule above ordinary footnotes.
iffootnoterule = False
[studynotes]
; Preserve the source colophons, carried as categorized standard sidebars.
includesidebar = True
