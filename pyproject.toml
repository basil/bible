# The build runs from the checkout, as `python3 -m bible` with src/ on the path
# (compose.yaml sets PYTHONPATH), so it is never installed and has no [project]
# table. Its dependencies, and PTXprint's, are pinned in requirements.txt.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
# Keep pytest's cache with the other generated files, out of the working tree.
cache_dir = "build/pytest-cache"
# The venv sees Ubuntu's system site-packages; load no plugins from there.
addopts = "-ra --strict-markers --disable-plugin-autoload"

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "scripts", "tests"]
mypy_path = ["src", "scripts", "tests"]
explicit_package_bases = true
cache_dir = "build/mypy-cache"

# These pinned upstream libraries publish no typing marker or stub package.
[[tool.mypy.overrides]]
module = ["fontTools.*", "lxml.*", "smartypants", "ptxprint.*", "usfmtc"]
ignore_missing_imports = true
