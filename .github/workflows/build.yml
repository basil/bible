---
name: Build PDF
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    # A newer push supersedes this build. Scoped to the job, not the workflow,
    # so that it never cancels a Pages deployment already in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make bootstrap
      - run: make validate
      - run: make test
      # What the change does to the edition, line by line, for the reviewer.
      # A base that cannot write a review, as one from before `make review`,
      # has nothing to compare with: that is said, and fails no build.
      - name: Review against the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth 1 origin "$GITHUB_BASE_REF"
          if make review-diff BASE=FETCH_HEAD; then
            {
              echo '```diff'
              head -c 60000 build/review.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No review diff: the base branch or this one could not write a review." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: make pdf
      - name: Prepare Pages site
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p _site
          cp site/index.html dist/bible.pdf _site/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site/
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
