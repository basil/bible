---
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # Valkyrie OT is proprietary: only the published edition, built from
      # master, may have it, and no pull request can reach the secrets. The
      # bootstrap finds the faces through fontconfig, as on a developer's machine.
      - name: Install Valkyrie OT (master only)
        if: github.ref == 'refs/heads/master'
        env:
          FONT_URL: ${{ secrets.FONT_URL }}
          FONT_TOKEN: ${{ secrets.FONT_TOKEN }}
        run: |
          curl --fail --silent --show-error -H "X-Font-Token: ${FONT_TOKEN}" -o "$RUNNER_TEMP/fonts.zip" "$FONT_URL"
          mkdir -p ~/.local/share/fonts/valkyrie
          unzip -o "$RUNNER_TEMP/fonts.zip" -d ~/.local/share/fonts/valkyrie
          fc-cache -f
          fc-list ':family=Valkyrie OT A' family style
      - run: make bootstrap
      - run: make lint
      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
      - run: make validate
      - run: make test
      - name: Restore page-filler checkpoints (master only)
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/page-fill-cache/
          key: ${{ runner.os }}-page-fill-v1-valkyrie-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-page-fill-v1-valkyrie-
      - name: Build filled release PDF
        if: github.ref == 'refs/heads/master'
        run: make pdf
      - name: Build unfilled proof PDF
        if: github.ref != 'refs/heads/master'
        run: make pdf-unfilled
      # Keyed by content, so a run that changes no checkpoint saves no copy.
      - name: Save page-filler checkpoints
        if: always() && github.ref == 'refs/heads/master' && hashFiles('build/page-fill-cache/**/*.json') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: build/page-fill-cache/
          key: ${{ runner.os }}-page-fill-v1-valkyrie-${{ hashFiles('build/page-fill-cache/**/*.json') }}
      - run: make web
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix site run test:integration
      - name: Include PDF downloads
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            cp dist/bible.pdf site/.vitepress/dist/
          else
            cp dist/bible-unfilled.pdf site/.vitepress/dist/bible.pdf
          fi
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist/
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
