---
name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # Valkyrie OT is proprietary: only the published edition, built from
      # master, may have it, and no pull request can reach the secrets. The
      # bootstrap finds the faces through fontconfig, as on a developer's machine.
      - name: Install Valkyrie OT (master only)
        if: github.ref == 'refs/heads/master'
        env:
          FONT_URL: ${{ secrets.FONT_URL }}
          FONT_TOKEN: ${{ secrets.FONT_TOKEN }}
        run: |
          curl --fail --silent --show-error -H "X-Font-Token: ${FONT_TOKEN}" -o "$RUNNER_TEMP/fonts.zip" "$FONT_URL"
          mkdir -p ~/.local/share/fonts/valkyrie
          unzip -o "$RUNNER_TEMP/fonts.zip" -d ~/.local/share/fonts/valkyrie
          fc-cache -f
          fc-list ':family=Valkyrie OT A' family style
      - run: make bootstrap
      - run: make lint
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      - run: make validate
      - run: make test
      - run: make pdf
      - run: make web
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix site run test:integration
      - name: Include PDF downloads
        run: cp dist/bible.pdf site/.vitepress/dist/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist/
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
