---
name: oleb
services:
  toolchain:
    build:
      context: .
    image: oleb:local
    # The image exists only locally; never look it up in a registry.
    pull_policy: never
    network_mode: none
    environment:
      HOME: /tmp/home
      # The build runs from the checkout: python3 -m bible.
      PYTHONPATH: /work/src
    volumes:
      - .:/work:z
  dockerfmt:
    image: ghcr.io/reteps/dockerfmt:v0.5.4
    pull_policy: always
    network_mode: none
    working_dir: /work
    volumes:
      - .:/work:z
  hadolint:
    image: hadolint/hadolint:v2.15.1
    pull_policy: always
    network_mode: none
