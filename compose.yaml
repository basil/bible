---
name: brenton-kjv-bible
services:
  toolchain:
    build:
      context: .
    image: brenton-kjv-bible:local
    # The image exists only locally; never look it up in a registry.
    pull_policy: never
    network_mode: none
    environment:
      HOME: /tmp/home
      # The build runs from the checkout: python3 -m bible.
      PYTHONPATH: /work/src
    volumes:
      - .:/work:Z
